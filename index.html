<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You Are Fish</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(circle at 50% 20%, #12324a 0%, #061018 55%, #03080c 100%);
        color: #d7ecf5;
      }

      main {
        max-width: 36rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.4rem, 8vw, 4.2rem);
        letter-spacing: 0.04em;
        font-weight: 400;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #9ec3d4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You Are Fish</h1>
      <p>
        A webcam-based aquarium prototype. The live head-pose app still runs
        locally; this page is the public deployment while the web experience is
        built.
      </p>
    </main>
  </body>
</html>
